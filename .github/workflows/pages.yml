name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble public site
        run: |
          mkdir -p _site/output
          cp index.html prd.html report.html part-2.html supporting-notes.html scope-notes.html example-brief.html design-notes.html styles.css app.js .nojekyll _site/
          cp output/part-1-delivery-triage.md _site/output/
          cp output/part-1-delivery-triage-extended.md _site/output/
          cp output/part-1-evidence-notes.md _site/output/
          cp output/part-1-scope-assumptions.md _site/output/
          cp output/part-2-context-tooling-prd.md _site/output/
          cp output/part-2-context-tooling-design.md _site/output/
          cp output/part-2-example-daily-brief.md _site/output/
          cp output/part-2-design-diagram.mmd _site/output/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
